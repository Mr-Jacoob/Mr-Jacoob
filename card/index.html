<style>
  :root{
    --bg:#0b0c16;
    --card:rgba(22,24,40,.62);
    --stroke:rgba(255,255,255,.09);
    --stroke-2:rgba(255,255,255,.16);
    --text:#e9e9f4;
    --muted:#9aa0bd;
    --accent:#a78bfa;
    --accent-2:#7dd3fc;
    --radius:20px;
    --shadow:0 26px 70px -30px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    min-height:100svh;
    background:var(--bg);
    color:var(--text);
    font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ── фон ── */
  .aurora{position:fixed;inset:-20vmax;z-index:-2;filter:blur(70px);opacity:.7;pointer-events:none}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite}
  .b1{width:52vmax;height:52vmax;left:-8vmax;top:-6vmax;background:radial-gradient(circle at 30% 30%,#7c3aed,transparent 62%)}
  .b2{width:46vmax;height:46vmax;right:-10vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,#0ea5e9,transparent 62%);animation-delay:-7s}
  .b3{width:44vmax;height:44vmax;left:18vmax;bottom:-16vmax;background:radial-gradient(circle at 50% 50%,#ec4899,transparent 62%);animation-delay:-13s}
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(6vmax,-4vmax,0) scale(1.12)}
    66%{transform:translate3d(-5vmax,5vmax,0) scale(.94)}
  }
  .grid{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%,#000 8%,transparent 70%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 8%,transparent 70%);
  }

  /* ── карточка ── */
  .card{
    width:100%;max-width:380px;
    background:var(--card);
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    padding:18px 16px 14px;
    position:relative;
    animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(140deg,rgba(167,139,250,.55),transparent 40%,transparent 60%,rgba(125,211,252,.45));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

  /* ── шапка: аватар слева, текст справа ── */
  .head{display:flex;align-items:center;gap:13px}
  .avatar-wrap{position:relative;width:60px;height:60px;flex:none}
  .avatar-wrap::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--accent),var(--accent-2),#ec4899,var(--accent));
    animation:spin 6s linear infinite;z-index:0;filter:blur(5px);opacity:.85;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    position:relative;z-index:1;width:60px;height:60px;border-radius:50%;
    object-fit:cover;border:2px solid #12131f;background:#12131f;display:block;
  }
  .status{
    position:absolute;z-index:2;right:0;bottom:0;
    width:14px;height:14px;border-radius:50%;background:#34d399;border:2px solid #12131f;
    box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2.2s infinite;
  }
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  .id{min-width:0}
  h1{margin:0;font-size:20px;line-height:1.15;letter-spacing:-.02em;font-weight:700}
  .role{
    margin:2px 0 0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;
    color:var(--accent);
  }
  .bio{margin:4px 0 0;font-size:11.5px;line-height:1.4;color:var(--muted)}

  /* ── строка с телефоном ── */
  .phone-row{
    display:flex;align-items:center;gap:8px;margin-top:12px;
    padding:9px 12px;border-radius:13px;
    background:rgba(255,255,255,.045);border:1px solid var(--stroke);
  }
  .phone-row a{
    flex:1;min-width:0;text-decoration:none;color:var(--text);
    font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:500;letter-spacing:.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .phone-row .pico{width:16px;height:16px;flex:none;color:var(--accent)}
  .copy{
    flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    padding:5px;border-radius:8px;transition:color .15s,background .15s;line-height:0;
  }
  .copy:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .copy svg{width:15px;height:15px;display:block}

  /* ── главные кнопки ── */
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:7px;
    text-decoration:none;color:var(--text);font-size:12.5px;font-weight:600;font-family:inherit;
    padding:11px 6px;border-radius:13px;border:1px solid var(--stroke-2);
    background:rgba(255,255,255,.05);cursor:pointer;
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28)}
  .btn:active{transform:translateY(0)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.call{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:transparent;color:#fff;box-shadow:0 10px 24px -14px #7c3aed}
  .btn.wa{background:linear-gradient(135deg,#128C7E,#25D366);border-color:transparent;color:#fff;box-shadow:0 10px 24px -14px #25D366}
  .btn.revolut{
    grid-column:1 / -1;background:linear-gradient(135deg,#0b5bd3,#2b7fff);
    border-color:transparent;color:#fff;box-shadow:0 10px 26px -14px #1f6fff;
  }

  /* ── соцсети: плитки ── */
  .socials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:5px;
    text-decoration:none;color:var(--text);
    padding:10px 4px 8px;border-radius:13px;
    background:rgba(255,255,255,.04);border:1px solid transparent;
    transition:transform .16s ease,background .16s ease,border-color .16s ease;
  }
  .tile:hover{transform:translateY(-2px);background:rgba(255,255,255,.085);border-color:var(--stroke-2)}
  .tile svg{width:19px;height:19px}
  .tile b{font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.01em}
  .tile.site svg{color:var(--accent)}
  .tile.ig svg{color:#f472b6}
  .tile.gh svg{color:#e9e9f4}
  .tile.ml svg{color:#34d399}

  /* ── низ ── */
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .ghost{
    display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;
    font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;
    padding:9px;border-radius:12px;border:1px dashed var(--stroke-2);background:transparent;
    text-decoration:none;transition:color .16s,border-color .16s,background .16s;
  }
  .ghost:hover{color:var(--text);border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.04)}
  .ghost svg{width:14px;height:14px}
  .sig{margin:11px 0 0;text-align:center;font-size:10px;color:#5f6484;font-family:"JetBrains Mono",monospace}

  /* ── тост ── */
  .toast{
    position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:rgba(20,22,36,.95);border:1px solid var(--stroke-2);color:var(--text);
    padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s ease;z-index:50;
    backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* ── совсем низкие экраны: убираем лишнее ── */
  @media (max-height:620px){
    .bio{display:none}
    .sig{display:none}
    .card{padding:15px 14px 12px}
    .avatar-wrap,.avatar{width:52px;height:52px}
    h1{font-size:18px}
  }
  @media (max-width:340px){
    .socials{grid-template-columns:repeat(2,1fr)}
    .actions{grid-template-columns:repeat(2,1fr)}
    .btn.revolut{grid-column:1 / -1}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>

<script>
/* ═══════════════════════════════════════════════════════════
   ДАННЫЕ ВИЗИТКИ ЖИВУТ В HTML ВЫШЕ — правь прямо в разметке:
     • телефон  — <a id="l-phone" href="tel:...">   и кнопка id="a-call"
     • WhatsApp — id="a-wa"      • Telegram — id="a-tg"
     • Revolut  — id="a-rev"
     • сайт     — id="l-site"    • Instagram — id="l-ig"
     • GitHub   — id="l-gh"      • E-mail   — id="l-mail"
     • имя для контактов — атрибут data-fullname у <main class="card">
   Скрипт ниже просто читает их отсюда — дублировать нигде не нужно.
   ═══════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const card = document.querySelector(".card");
const strip = (el, prefix) => el.getAttribute("href").replace(prefix, "");

const CARD = {
  name:         $("c-name").textContent.trim(),
  fullName:     card.dataset.fullname,
  role:         $("c-role").textContent.trim(),
  phoneRaw:     strip($("l-phone"), "tel:"),
  phoneDisplay: $("l-phone").textContent.trim(),
  email:        strip($("l-mail"), "mailto:"),
  site:         $("l-site").href,
  telegram:     $("a-tg").href,
  whatsapp:     $("a-wa").href,
  instagram:    $("l-ig").href,
  github:       $("l-gh").href,
  revolut:      $("a-rev").href,
};

$("year").textContent = new Date().getFullYear();

/* тост */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
}

/* копирование */
async function copy(text, label){
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch{}
    ta.remove();
  }
  toast(label + " скопирован");
}
document.querySelectorAll("[data-copy]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    copy(CARD.phoneRaw, "Номер");
  });
});

/* долгое нажатие на плитку E-mail копирует адрес */
let mailTimer;
const mail = $("l-mail");
const startMail = () => { mailTimer = setTimeout(() => copy(CARD.email, "E-mail"), 550); };
const stopMail  = () => clearTimeout(mailTimer);
mail.addEventListener("touchstart", startMail, {passive:true});
mail.addEventListener("touchend", stopMail);
mail.addEventListener("touchmove", stopMail);
mail.addEventListener("mousedown", startMail);
mail.addEventListener("mouseup", stopMail);
mail.addEventListener("mouseleave", stopMail);

/* сохранить в контакты (.vcf) */
$("btn-vcf").addEventListener("click", () => {
  const parts = CARD.fullName.trim().split(/\s+/);
  const last  = parts.length > 1 ? parts.pop() : "";
  const first = parts.join(" ");
  const vcf = [
    "BEGIN:VCARD","VERSION:3.0",
    "N:" + last + ";" + first + ";;;",
    "FN:" + CARD.fullName,
    "TITLE:" + CARD.role,
    "TEL;TYPE=CELL:" + CARD.phoneRaw,
    "EMAIL;TYPE=INTERNET:" + CARD.email,
    "URL:" + CARD.site,
    "X-SOCIALPROFILE;TYPE=whatsapp:" + CARD.whatsapp,
    "X-SOCIALPROFILE;TYPE=telegram:" + CARD.telegram,
    "X-SOCIALPROFILE;TYPE=instagram:" + CARD.instagram,
    "X-SOCIALPROFILE;TYPE=github:" + CARD.github,
    "NOTE:Revolut: " + CARD.revolut,
    "END:VCARD"
  ].join("\r\n");

  const url = URL.createObjectURL(new Blob([vcf], {type:"text/vcard;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = CARD.fullName.replace(/\s+/g,"-").toLowerCase() + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Контакт скачан");
});

/* поделиться */
$("btn-share").addEventListener("click", async () => {
  const data = {
    title: CARD.name + " — " + CARD.role,
    text:  "Моя визитка",
    url:   location.href
  };
  if(navigator.share){
    try{ await navigator.share(data); return; }catch{ return; }
  }
  copy(location.href, "Ссылка");
});

/* лёгкий 3D-наклон на десктопе */
if(window.matchMedia("(hover:hover) and (pointer:fine)").matches &&
   !window.matchMedia("(prefers-reduced-motion:reduce)").matches){
  card.addEventListener("mousemove", (e) => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  - .5;
    const y = (e.clientY - r.top)  / r.height - .5;
    card.style.transform = `perspective(900px) rotateX(${(-y*3.5).toFixed(2)}deg) rotateY(${(x*3.5).toFixed(2)}deg)`;
  });
  card.addEventListener("mouseleave", () => { card.style.transform = ""; });
}
</script>
