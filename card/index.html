<style>
  :root{
    --bg:#0b0c16;
    --bg-2:#11132250;
    --card:rgba(22,24,40,.62);
    --stroke:rgba(255,255,255,.09);
    --stroke-2:rgba(255,255,255,.16);
    --text:#e9e9f4;
    --muted:#9aa0bd;
    --accent:#a78bfa;
    --accent-2:#7dd3fc;
    --revolut:#1f6fff;
    --radius:22px;
    --shadow:0 30px 80px -30px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }

  /* ── фон: аврора ── */
  .aurora{position:fixed;inset:-20vmax;z-index:-2;filter:blur(70px);opacity:.75;pointer-events:none}
  .blob{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite}
  .b1{width:52vmax;height:52vmax;left:-8vmax;top:-6vmax;background:radial-gradient(circle at 30% 30%,#7c3aed,transparent 62%)}
  .b2{width:46vmax;height:46vmax;right:-10vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,#0ea5e9,transparent 62%);animation-delay:-7s}
  .b3{width:44vmax;height:44vmax;left:18vmax;bottom:-16vmax;background:radial-gradient(circle at 50% 50%,#ec4899,transparent 62%);animation-delay:-13s}
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(6vmax,-4vmax,0) scale(1.12)}
    66%{transform:translate3d(-5vmax,5vmax,0) scale(.94)}
  }
  .grid{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 30%,#000 10%,transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 10%,transparent 72%);
  }

  /* ── карточка ── */
  .card{
    width:100%;max-width:420px;
    background:var(--card);
    border:1px solid var(--stroke);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    padding:30px 22px 22px;
    position:relative;
    overflow:hidden;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
    background:linear-gradient(140deg,rgba(167,139,250,.55),transparent 40%,transparent 60%,rgba(125,211,252,.45));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}

  /* ── шапка ── */
  .head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
  .avatar-wrap{position:relative;width:104px;height:104px}
  .avatar-wrap::after{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--accent),var(--accent-2),#ec4899,var(--accent));
    animation:spin 6s linear infinite;z-index:0;filter:blur(6px);opacity:.85;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    position:relative;z-index:1;width:104px;height:104px;border-radius:50%;
    object-fit:cover;border:3px solid #12131f;background:#12131f;display:block;
  }
  .status{
    position:absolute;z-index:2;right:2px;bottom:2px;
    width:20px;height:20px;border-radius:50%;background:#34d399;border:3px solid #12131f;
    box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2.2s infinite;
  }
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:700}
  .role{
    margin:0;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;
    color:var(--accent);letter-spacing:.02em;
  }
  .bio{margin:2px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted);max-width:32ch}

  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:4px}
  .tag{
    font-size:11px;font-family:"JetBrains Mono",monospace;color:#c9cbe4;
    border:1px solid var(--stroke-2);border-radius:999px;padding:4px 9px;background:rgba(255,255,255,.04);
  }

  hr.sep{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--stroke-2),transparent);margin:22px 0 18px}

  /* ── основные кнопки ── */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;color:var(--text);font-size:14px;font-weight:600;
    padding:13px 12px;border-radius:14px;border:1px solid var(--stroke-2);
    background:rgba(255,255,255,.05);
    transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
    cursor:pointer;font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.28)}
  .btn:active{transform:translateY(0)}
  .btn svg{width:18px;height:18px;flex:none}
  .btn.call{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:transparent;color:#fff;box-shadow:0 12px 30px -14px #7c3aed}
  .btn.call:hover{box-shadow:0 16px 36px -12px #7c3aed}
  .btn.revolut{
    grid-column:1 / -1;background:linear-gradient(135deg,#0b5bd3,#2b7fff);
    border-color:transparent;color:#fff;box-shadow:0 12px 30px -14px var(--revolut);
  }
  .btn.revolut:hover{box-shadow:0 16px 36px -12px var(--revolut)}
  .btn.revolut small{display:block;font-weight:400;font-size:11px;opacity:.85}

  /* ── список ссылок ── */
  .links{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .link{
    display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);
    padding:11px 13px;border-radius:14px;border:1px solid transparent;
    background:rgba(255,255,255,.035);
    transition:transform .16s ease,background .16s ease,border-color .16s ease;
  }
  .link:hover{background:rgba(255,255,255,.08);border-color:var(--stroke-2);transform:translateX(3px)}
  .ico{
    width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;
    background:rgba(167,139,250,.14);color:var(--accent);
  }
  .ico svg{width:19px;height:19px}
  .ico.tg{background:rgba(41,171,226,.16);color:#4fc3f7}
  .ico.ig{background:linear-gradient(135deg,rgba(245,133,41,.22),rgba(221,42,123,.22),rgba(129,52,175,.22));color:#f472b6}
  .ico.gh{background:rgba(255,255,255,.1);color:#e9e9f4}
  .ico.ml{background:rgba(52,211,153,.14);color:#34d399}
  .meta{min-width:0;flex:1}
  .meta b{display:block;font-size:14px;font-weight:600}
  .meta span{display:block;font-size:12px;color:var(--muted);font-family:"JetBrains Mono",monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .copy{
    flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
    padding:6px;border-radius:8px;transition:color .15s,background .15s;
  }
  .copy:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .copy svg{width:16px;height:16px;display:block}

  /* ── низ ── */
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .ghost{
    display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
    padding:12px;border-radius:14px;border:1px dashed var(--stroke-2);background:transparent;
    text-decoration:none;transition:color .16s,border-color .16s,background .16s;
  }
  .ghost:hover{color:var(--text);border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.04)}
  .ghost svg{width:16px;height:16px}
  .sig{margin:16px 0 0;text-align:center;font-size:11px;color:#5f6484;font-family:"JetBrains Mono",monospace}

  /* ── тост ── */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
    background:rgba(20,22,36,.95);border:1px solid var(--stroke-2);color:var(--text);
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s ease;z-index:50;
    backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:380px){
    .card{padding:26px 16px 18px}
    h1{font-size:23px}
    .actions{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════
   ВСЕ ДАННЫЕ ВИЗИТКИ — МЕНЯЙ ТОЛЬКО ЗДЕСЬ
   ═══════════════════════════════════════════════════════════ */
const CARD = {
  name:    "Jacob",
  fullName:"Ziyodullo Rahmonjonov",   // для сохранения в контакты
  role:    "Creative Developer",
  bio:     "Делаю интерфейсы, которые оживают: motion, шейдеры, частицы и свет.",

  // ↓↓↓ ЗАМЕНИ НА СВОЙ НОМЕР (в международном формате, без пробелов в phoneRaw)
  phoneRaw:      "+998000000000",
  phoneDisplay:  "+998 00 000 00 00",

  email:   "ziyodullorahmonjonov@gmail.com",
  site:    "https://ziyodullo.com",

  // ↓↓↓ ЗАМЕНИ НА СВОИ ССЫЛКИ
  telegram:  "https://t.me/username",          // твой Telegram
  instagram: "https://instagram.com/username", // твой Instagram
  github:    "https://github.com/Mr-Jacoob",

  // ↓↓↓ ССЫЛКА НА REVOLUT (revolut.me/твой_тег)
  revolut:   "https://revolut.me/username",
};
/* ═══════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const pretty = (u) => u.replace(/^https?:\/\//,"").replace(/\/$/,"");
const handle = (u) => "@" + pretty(u).split("/").filter(Boolean).pop();

$("c-name").textContent = CARD.name;
$("c-role").textContent = CARD.role;
$("c-bio").textContent  = CARD.bio;
document.title = CARD.name + " — " + CARD.role;

$("a-call").href = "tel:" + CARD.phoneRaw;
$("a-tg").href   = CARD.telegram;
$("a-rev").href  = CARD.revolut;

$("l-site").href = CARD.site;         $("t-site").textContent  = pretty(CARD.site);
$("l-tg").href   = CARD.telegram;     $("t-tg").textContent    = handle(CARD.telegram);
$("l-ig").href   = CARD.instagram;    $("t-ig").textContent    = handle(CARD.instagram);
$("l-gh").href   = CARD.github;       $("t-gh").textContent    = handle(CARD.github);
$("l-mail").href = "mailto:" + CARD.email;   $("t-mail").textContent  = CARD.email;
$("l-phone").href= "tel:" + CARD.phoneRaw;   $("t-phone").textContent = CARD.phoneDisplay;
$("year").textContent = new Date().getFullYear();

/* тост */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1900);
}

/* копирование */
async function copy(text, label){
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch{}
    ta.remove();
  }
  toast(label + " скопирован");
}
document.querySelectorAll("[data-copy]").forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.preventDefault();
    const k = btn.dataset.copy;
    if(k === "mail") copy(CARD.email, "E-mail");
    else copy(CARD.phoneRaw, "Номер");
  });
});

/* сохранить в контакты (.vcf) */
$("btn-vcf").addEventListener("click", () => {
  const parts = CARD.fullName.trim().split(/\s+/);
  const last  = parts.length > 1 ? parts.pop() : "";
  const first = parts.join(" ");
  const vcf = [
    "BEGIN:VCARD","VERSION:3.0",
    "N:" + last + ";" + first + ";;;",
    "FN:" + CARD.fullName,
    "TITLE:" + CARD.role,
    "TEL;TYPE=CELL:" + CARD.phoneRaw,
    "EMAIL;TYPE=INTERNET:" + CARD.email,
    "URL:" + CARD.site,
    "X-SOCIALPROFILE;TYPE=telegram:" + CARD.telegram,
    "X-SOCIALPROFILE;TYPE=instagram:" + CARD.instagram,
    "X-SOCIALPROFILE;TYPE=github:" + CARD.github,
    "NOTE:Revolut: " + CARD.revolut,
    "END:VCARD"
  ].join("\r\n");

  const url = URL.createObjectURL(new Blob([vcf], {type:"text/vcard;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = CARD.fullName.replace(/\s+/g,"-").toLowerCase() + ".vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Контакт скачан");
});

/* поделиться */
$("btn-share").addEventListener("click", async () => {
  const data = {
    title: CARD.name + " — " + CARD.role,
    text:  "Моя визитка",
    url:   location.href
  };
  if(navigator.share){
    try{ await navigator.share(data); return; }catch{ return; }
  }
  copy(location.href, "Ссылка");
});

/* лёгкий 3D-наклон карточки на десктопе */
const card = document.querySelector(".card");
if(window.matchMedia("(hover:hover) and (pointer:fine)").matches &&
   !window.matchMedia("(prefers-reduced-motion:reduce)").matches){
  card.addEventListener("mousemove", (e) => {
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width  - .5;
    const y = (e.clientY - r.top)  / r.height - .5;
    card.style.transform = `perspective(900px) rotateX(${(-y*4).toFixed(2)}deg) rotateY(${(x*4).toFixed(2)}deg)`;
  });
  card.addEventListener("mouseleave", () => { card.style.transform = ""; });
}
